# Il piano gratuito di Supabase mette in pausa il progetto dopo 7 giorni senza
# attività. Ogni 3 giorni questo job fa una richiesta leggera all'API, con la
# stessa chiave pubblica che usa l'app (nessun segreto). Si può anche lanciare
# a mano da Actions → supabase-sveglia → Run workflow.
name: supabase-sveglia
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Richiesta a Supabase
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/js/01-config.js | head -1)
          KEY=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" src/js/01-config.js | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/" -H "apikey: $KEY")
          echo "Supabase ha risposto $code"
          test "$code" -lt 500
